AWSTemplateFormatVersion: "2010-09-09"
Description: Standalone execute-api VPC endpoint for manual incident report access through the Client VPN.

Parameters:
  AppName:
    Type: String
    Default: athena-incident-report
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-]{2,48}$"
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC associated with the Client VPN.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Existing subnet in which the endpoint network interface is created.
  AllowedCidr:
    Type: String
    Default: 172.16.0.0/16
    Description: VPC CIDR presented as the source for Client VPN traffic.
    AllowedPattern: "^(([0-9]{1,3}\\.){3}[0-9]{1,3})/[0-9]{1,2}$"
  TargetApiArn:
    Type: String
    Description: Execute API ARN that callers may invoke through this endpoint.
    AllowedPattern: "^arn:[a-z0-9-]+:execute-api:[a-z0-9-]+:[0-9]{12}:[a-zA-Z0-9]+/\\*$"

Resources:
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS access to the incident report private API endpoint
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedCidr
          Description: HTTPS from Client VPN-associated VPC addresses
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Stateful endpoint responses
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-private-api-access-sg"
        - Key: Application
          Value: !Ref AppName

  ExecuteApiVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.execute-api"
      PrivateDnsEnabled: false
      SubnetIds:
        - !Ref SubnetId
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: execute-api:Invoke
            Resource: !Ref TargetApiArn

Outputs:
  VpcEndpointId:
    Value: !Ref ExecuteApiVpcEndpoint
  VpcEndpointDnsName:
    Value:
      Fn::Select:
        - 1
        - Fn::Split:
            - ":"
            - Fn::Select:
                - 0
                - Fn::GetAtt:
                    - ExecuteApiVpcEndpoint
                    - DnsEntries
  SecurityGroupId:
    Value: !Ref EndpointSecurityGroup
