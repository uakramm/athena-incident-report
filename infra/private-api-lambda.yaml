AWSTemplateFormatVersion: "2010-09-09"
Description: Private REST API Gateway dispatching tenant-specific, VPC-attached incident report Lambdas.

Parameters:
  AppName:
    Type: String
    Default: athena-incident-report
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-]{2,48}$"
  EnvironmentName:
    Type: String
    Default: manual
    AllowedPattern: "^[a-zA-Z0-9-]{2,32}$"
  SourceCodeS3Bucket:
    Type: String
    Description: Existing S3 bucket containing the Lambda source zip.
  SourceCodeS3Key:
    Type: String
    Description: S3 key for the Lambda source zip.
  DependenciesLayerS3Bucket:
    Type: String
    Description: Existing S3 bucket containing the Lambda dependencies layer zip.
  DependenciesLayerS3Key:
    Type: String
    Description: S3 key for the Lambda dependencies layer zip.
  LambdaRuntime:
    Type: String
    Default: python3.12
    AllowedValues: [python3.12, python3.13]
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC reachable from the AWS Client VPN.
  ExistingExecuteApiVpcEndpointId:
    Type: String
    Description: Existing execute-api endpoint reachable through the Client VPN.
    AllowedPattern: "^vpce-[a-zA-Z0-9]+$"
  ExistingExecuteApiVpcId:
    Type: String
    Description: VPC containing the existing execute-api endpoint.
    AllowedPattern: "^vpc-[a-zA-Z0-9]+$"
  AthenaWorkerSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Existing Athena private subnets allowed to reach the Athena indexer endpoint.
  NbsWorkerSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Existing NBS private subnets allowed to reach the NBS indexer endpoint.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: Existing VPC CIDR used for worker-to-indexer TCP 9200 egress.
    AllowedPattern: "^(([0-9]{1,3}\\.){3}[0-9]{1,3})/[0-9]{1,2}$"
  ApiStageName:
    Type: String
    Default: manual
    AllowedPattern: "^[a-zA-Z0-9_-]{1,32}$"
  LambdaMemorySize:
    Type: Number
    Default: 1024
    MinValue: 128
    MaxValue: 10240
  LambdaTimeoutSeconds:
    Type: Number
    Default: 900
    MinValue: 30
    MaxValue: 900
  ReservedConcurrentExecutions:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
  ReportEmailFrom:
    Type: String
    Default: shelly@athenasecuritygrp.com
    Description: Microsoft Graph mailbox used to send reports.

Resources:
  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AppName}-${EnvironmentName} report workers"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Secrets Manager and Microsoft Graph HTTPS
        - IpProtocol: tcp
          FromPort: 9200
          ToPort: 9200
          CidrIp: !Ref VpcCidr
          Description: Tenant OpenSearch indexer HTTPS
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${EnvironmentName}-workers-sg"
        - Key: Application
          Value: !Ref AppName

  ReportExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-cloudwatch-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}-${EnvironmentName}-*:*"
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"
        - PolicyName: read-tenant-report-config-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:athena-incident-report/*/config-*"
      Tags:
        - Key: Application
          Value: !Ref AppName

  AthenaReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${EnvironmentName}-athena"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Application
          Value: !Ref AppName

  NbsReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${EnvironmentName}-nbs"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Application
          Value: !Ref AppName

  ReportDependenciesLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub "${AppName}-${EnvironmentName}-dependencies"
      Description: Python dependencies for the Athena incident report Lambda.
      Content:
        S3Bucket: !Ref DependenciesLayerS3Bucket
        S3Key: !Ref DependenciesLayerS3Key
      CompatibleArchitectures:
        - x86_64
      CompatibleRuntimes:
        - !Ref LambdaRuntime

  AthenaReportFunction:
    Type: AWS::Lambda::Function
    DependsOn: AthenaReportLogGroup
    Properties:
      FunctionName: !Sub "${AppName}-${EnvironmentName}-athena"
      Code:
        S3Bucket: !Ref SourceCodeS3Bucket
        S3Key: !Ref SourceCodeS3Key
      Role: !GetAtt ReportExecutionRole.Arn
      Runtime: !Ref LambdaRuntime
      Handler: lambda_handler.handler
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeoutSeconds
      ReservedConcurrentExecutions: !Ref ReservedConcurrentExecutions
      Architectures:
        - x86_64
      Layers:
        - !Ref ReportDependenciesLayer
      VpcConfig:
        SecurityGroupIds:
          - !Ref WorkerSecurityGroup
        SubnetIds: !Ref AthenaWorkerSubnetIds
      Environment:
        Variables:
          REPORT_ALLOW_GET: "false"
          REPORT_EMAIL_FROM: !Ref ReportEmailFrom
          REPORT_LAMBDA_SEND_EMAIL: "true"
      Tags:
        - Key: Application
          Value: !Ref AppName

  NbsReportFunction:
    Type: AWS::Lambda::Function
    DependsOn: NbsReportLogGroup
    Properties:
      FunctionName: !Sub "${AppName}-${EnvironmentName}-nbs"
      Code:
        S3Bucket: !Ref SourceCodeS3Bucket
        S3Key: !Ref SourceCodeS3Key
      Role: !GetAtt ReportExecutionRole.Arn
      Runtime: !Ref LambdaRuntime
      Handler: lambda_handler.handler
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeoutSeconds
      ReservedConcurrentExecutions: !Ref ReservedConcurrentExecutions
      Architectures:
        - x86_64
      Layers:
        - !Ref ReportDependenciesLayer
      VpcConfig:
        SecurityGroupIds:
          - !Ref WorkerSecurityGroup
        SubnetIds: !Ref NbsWorkerSubnetIds
      Environment:
        Variables:
          REPORT_ALLOW_GET: "false"
          REPORT_EMAIL_FROM: !Ref ReportEmailFrom
          REPORT_LAMBDA_SEND_EMAIL: "true"
      Tags:
        - Key: Application
          Value: !Ref AppName

  DispatcherExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dispatch-report
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}-${EnvironmentName}-trigger:*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:athena-incident-report/*/config-*"
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt AthenaReportFunction.Arn
                  - !GetAtt NbsReportFunction.Arn
      Tags:
        - Key: Application
          Value: !Ref AppName

  DispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${EnvironmentName}-trigger"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Application
          Value: !Ref AppName

  DispatcherFunction:
    Type: AWS::Lambda::Function
    DependsOn: DispatcherLogGroup
    Properties:
      FunctionName: !Sub "${AppName}-${EnvironmentName}-trigger"
      Code:
        S3Bucket: !Ref SourceCodeS3Bucket
        S3Key: !Ref SourceCodeS3Key
      Role: !GetAtt DispatcherExecutionRole.Arn
      Runtime: !Ref LambdaRuntime
      Handler: lambda_handler.dispatch_handler
      MemorySize: 256
      Timeout: 15
      Architectures:
        - x86_64
      Environment:
        Variables:
          REPORT_WORKER_FUNCTIONS: !Sub
            - '{"athena":"${AthenaWorker}","nbs":"${NbsWorker}"}'
            - AthenaWorker: !Ref AthenaReportFunction
              NbsWorker: !Ref NbsReportFunction
      Tags:
        - Key: Application
          Value: !Ref AppName

  ReportApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${AppName}-${EnvironmentName}-private"
      Description: Private manual trigger for the Athena incident report.
      EndpointConfiguration:
        Types:
          - PRIVATE
      Policy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: execute-api:Invoke
            Resource: "execute-api:/*"
          - Effect: Deny
            Principal: "*"
            Action: execute-api:Invoke
            Resource: "execute-api:/*"
            Condition:
              StringNotEquals:
                aws:SourceVpce: !Ref ExistingExecuteApiVpcEndpointId
                aws:SourceVpc: !Ref ExistingExecuteApiVpcId
      Tags:
        - Key: Application
          Value: !Ref AppName

  RunResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ReportApi
      ParentId: !GetAtt ReportApi.RootResourceId
      PathPart: run

  HealthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ReportApi
      ParentId: !GetAtt ReportApi.RootResourceId
      PathPart: health

  RunPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ReportApi
      ResourceId: !Ref RunResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        TimeoutInMillis: 29000
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DispatcherFunction.Arn}/invocations"

  HealthGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ReportApi
      ResourceId: !Ref HealthResource
      HttpMethod: GET
      AuthorizationType: NONE
      MethodResponses:
        - StatusCode: "200"
          ResponseModels:
            application/json: Empty
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode":200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseTemplates:
              application/json: '{"ok":true,"service":"athena-incident-report"}'

  ReportApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt DispatcherFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ReportApi}/*/POST/run"

  ReportApiDeploymentPolicyV2:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - RunPostMethod
      - HealthGetMethod
    Properties:
      RestApiId: !Ref ReportApi
      Description: !Sub "Private report API deployment for ${SourceCodeS3Key}"

  ReportApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ReportApi
      DeploymentId: !Ref ReportApiDeploymentPolicyV2
      StageName: !Ref ApiStageName
      Tags:
        - Key: Application
          Value: !Ref AppName

Outputs:
  PrivateApiUrl:
    Description: HTTPS base URL, reachable only through the VPC endpoint/VPN path.
    Value: !Sub "https://${ReportApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}"
  RunUrl:
    Description: Manual asynchronous report trigger URL.
    Value: !Sub "https://${ReportApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}/run"
  HealthUrl:
    Description: API Gateway mock health URL; it does not invoke Lambda.
    Value: !Sub "https://${ReportApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}/health"
  RestApiId:
    Value: !Ref ReportApi
  ExecuteApiVpcEndpointId:
    Value: !Ref ExistingExecuteApiVpcEndpointId
  DispatcherFunctionName:
    Value: !Ref DispatcherFunction
  WorkerSecurityGroupId:
    Value: !Ref WorkerSecurityGroup
  AthenaLambdaFunctionName:
    Value: !Ref AthenaReportFunction
  AthenaLambdaFunctionArn:
    Value: !GetAtt AthenaReportFunction.Arn
  NbsLambdaFunctionName:
    Value: !Ref NbsReportFunction
  NbsLambdaFunctionArn:
    Value: !GetAtt NbsReportFunction.Arn
